- method: pbe0-grac
  basis: d-aug-cc-pvdz
  protocol:
    type: df
    df_basis: aug-cc-pvqz-ri
    dft_settings:
      radial_points: 100
      spherical_points: 590
      radial_scheme:  TREUTLER
      spherical_scheme: LEBEDEV
    convergence:
      e_convergence: 1.e-10
      r_convergence: 1.e-10
      d_convergence: 1.e-10
