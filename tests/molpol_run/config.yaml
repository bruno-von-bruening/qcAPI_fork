    - bin/calc_IsoDensSurf.py
  multipolar_esp:
    python_env: qcp_objects
    script:
    - $PROPERTY_OBJECTS_HOME
    - bin/compute_dmp_esp.py
  run_psi4:
    python_env: run_psi4_test2
    script:
    - $RUN_PSI4_HOME
    - bin/run_psi4_exe.py
