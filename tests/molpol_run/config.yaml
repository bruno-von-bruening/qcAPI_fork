    python_env: run_camcasp
    script:
    - $RUN_CAMCASP_HOME
    - bin/my_runcamcasp.py
  density_esp:
    python_env: qcDENS
    script:
    - $DENSITY_OPERATIONS_HOME
    - bin/calc_esp.py
    shell_env:
      QC_DENSITY_OPERATIONS_LIB: $DENSITY_OPERATIONS_LIB
  esp_comparison:
    python_env: qcp_objects
    script:
    - $PROPERTY_OBJECTS_HOME
    - bin/compare_esp.py
  horton:
