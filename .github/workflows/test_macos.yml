name: macOS Python + Conda CI

on:
  workflow_dispatch:  # manual runs
  push:
    branches: [ main , CI_explore ]
  pull_request:


jobs:
    test-macos:
        runs-on: macos-14

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4
            with:
              fetch-depth: 1

          - name: Prepare env file and authenticate git for CI
            shell: bash
            run: |
              sed 's#git+ssh://git@github.com/#git+https://github.com/#g' install/qcpAPI_env.yaml > install/qcpAPI_env_ci.yaml
              git config --global url."https://${{ secrets.GH_PAT }}:@github.com/".insteadOf "https://github.com/"

          - name: Install Miniconda
            uses: conda-incubator/setup-miniconda@v3
            with:
              auto-update-conda: true
              activate-environment: test_env
              environment-file: install/qcpAPI_env_ci.yaml

          - name: Show environment info
            shell: bash -el {0}
            run: |
              python --version
              conda list

          - name: Install your package into environment
            shell: bash -el {0}
            run: pip install .

          - name: Run test script
            shell: bash -el {0}
            run: |
              cd tests/molpol_run
              python test.py
